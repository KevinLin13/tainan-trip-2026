<style>
:root{
  --bg:#f7f7f3; --card:#fff; --text:#20211f; --muted:#6f716b;
  --line:#e6e5df; --accent:#2f6f5e; --accent-soft:#e9f2ee;
  --move:#eef4fb; --action:#fff4d9; --train:#eeeafb; --danger:#9b4d2d;
  --shadow:0 4px 18px rgba(33,35,32,.07);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:760px;margin:0 auto;padding:env(safe-area-inset-top) 14px calc(32px + env(safe-area-inset-bottom))}
.hero{padding:22px 4px 12px}
.hero h1{font-size:25px;line-height:1.2;margin:0 0 7px}
.hero p{margin:0;color:var(--muted);font-size:14px;line-height:1.55}
.tabs{
  position:sticky;top:0;z-index:20;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;
  padding:10px 0;background:rgba(247,247,243,.92);backdrop-filter:blur(12px);
}
.tab{
  border:1px solid var(--line);background:#fff;color:var(--text);border-radius:13px;
  padding:11px 6px;font-weight:750;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.03)
}
.tab.active{background:var(--text);color:#fff;border-color:var(--text)}
.day{display:none}.day.active{display:block}
.day-head{margin:9px 0 14px;padding:16px;border-radius:18px;background:#20211f;color:white}
.day-head .date{font-size:20px;font-weight:800}
.day-head .route{margin-top:8px;font-size:12.5px;line-height:1.6;color:#d9d9d5}
.quick{
  margin:0 0 14px;padding:13px 14px;background:#fff;border:1px solid var(--line);
  border-radius:15px;font-size:13px;line-height:1.55;color:var(--muted)
}
.timeline{position:relative}
.card{
  position:relative;background:var(--card);border:1px solid var(--line);border-radius:17px;
  padding:15px 14px;margin:0 0 10px;box-shadow:var(--shadow)
}
.card.move{background:var(--move);box-shadow:none}
.card.action{background:var(--action);border-color:#ead49b}
.card.train{background:var(--train);border-color:#d7d0ef}
.top{display:flex;gap:10px;align-items:flex-start}
.check{
  width:24px;height:24px;flex:0 0 24px;border:1.5px solid #c8c9c4;border-radius:8px;background:#fff;
  appearance:none;-webkit-appearance:none;position:relative;margin:1px 0 0
}
.check:checked{background:var(--accent);border-color:var(--accent)}
.check:checked:after{content:"✓";position:absolute;color:#fff;font-weight:900;left:5px;top:0px;font-size:16px}
.content{min-width:0;flex:1}
.time{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:4px}
.title{font-size:17px;font-weight:820;line-height:1.35;word-break:break-word}
.meta{margin-top:7px;font-size:13.5px;color:#50524d;line-height:1.5}
.note{margin-top:8px;font-size:13.5px;line-height:1.58;color:var(--muted)}
.reserve{
  display:inline-block;margin-top:9px;padding:4px 8px;border-radius:999px;
  background:#f1f1ed;color:#555851;font-size:12px;font-weight:700
}
.reserve.hot{background:#ffe3d7;color:var(--danger)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:9px 13px;
  border-radius:12px;text-decoration:none;font-size:13.5px;font-weight:780;border:1px solid var(--line);
  background:#fff;color:var(--text)
}
.btn.primary{background:var(--accent);border-color:var(--accent);color:white}
.btn.call{background:#fff7ef;border-color:#f1cdae;color:#8b4d22}
.footer{padding:18px 4px 4px;color:var(--muted);font-size:12px;line-height:1.6;text-align:center}
.tools{display:flex;gap:8px;margin:0 0 12px}
.smallbtn{
  flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 8px;
  font-weight:700;color:#444;font-size:12.5px
}
.done .content{opacity:.48}
.done .title{text-decoration:line-through}
</style>

}

function isHot(reserve, place){
  const t = (reserve + " " + place);
  return /要先|建議|先聯絡|預訂|下單|車票/.test(t) && !/不用/.test(t);
}

function characterArt(row){
  const text = `${row.place ?? ''} ${row.note ?? ''} ${row.transport ?? ''}`;
  let type = 'rest';
  if(/出站、整理、找共享機車/.test(text)) type = 'luggage';
  else if(/夏林臭豆腐|福昇小食鱔魚意麵|水仙宮粽葉米糕|道達旅店取行李吃點心/.test(text)) type = 'food';
  else if(/飯店休息、整理行李|臺南車站候車/.test(text)) type = 'together';
  else if(/Foodpanda 下單蘇果の森林/.test(text)) type = 'action';
  else if(row.kind === 'train') type = 'train';
  else if(row.kind !== 'move' && /下單|外帶|取餐|Foodpanda/.test(text)) type = 'order';
  else if(row.kind !== 'move' && /行李/.test(text)) type = 'luggage';
  else if(row.kind === 'action' || /電話|預訂|確認/.test(text)) type = 'action';
  else if(row.kind === 'move' && /WeMo|機車|騎/.test(text)) type = 'ride';
  else if(row.kind === 'move' && /步行|散步/.test(text)) type = 'walk';
  else if(/共享機車|找車/.test(text)) type = 'ride';
  else if(/冰品|冰淇淋|冰棒|芋仔冰/.test(text)) type = 'ice';
  else if(/飲料|取飲料|杏仁茶/.test(text)) type = 'drink';
  else if(row.icon === '🍴' || /早餐|吃|餐|湯|割包|魚羹|臭豆腐|米糕|蝦捲|蔥肉餅|蔥油餅|意麵|肉燥/.test(text)) type = 'food';
  else if(row.icon === '📍' || /博物館|夜市|神農街|藝術街|艦|樹屋|平臺|美術館/.test(text)) type = 'sight';
  else if(/旅店|飯店|住宿|休息|行李/.test(text)) type = 'stay';

  const characterImages = {
    food: 'food-gallery5.gif',
    ride: 'scooter-cutout-v2.png',
    walk: 'walk-sushi-cutout.gif',
    ice: 'ice-cutout-v1.png',
    drink: 'drink-cutout-v1.png',
    luggage: 'luggage-cutout-v1.png',
    order: 'order-cutout-v1.png',
    sight: 'sight-gallery7.gif',
    action: 'action-gallery9.gif',
    train: 'train-cutout-v1.png',
    together: 'together-cutout-v1.png',
    stay: 'stay-gallery3.gif',
    rest: 'rest-gallery12.gif'
  };
  return `<div class="card-visual ${type}-visual ${type === 'ride' ? 'scooter-visual' : ''}" aria-hidden="true">
    <img class="card-character" src="${characterImages[type]}" alt="" width="86" height="66" loading="lazy" decoding="async">
    ${type === 'ride' ? '<span class="exhaust"></span><span class="exhaust second"></span>' : ''}
  </div>`;
}

function titleIcon(row){
  const icons = {
    '🍴': `<span class="title-icon food" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M5 3v8M3 3v4M7 3v4M3 7h4M5 11v10M16 3v18M16 3c3 2 4 5 0 8M16 11h5"/></svg></span>`,
    '🛵': `<span class="title-icon ride" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M6 18h7l2-7h3l2 7M10 11h5M14 11l-2-3h-3M18 8h2l1-2"/></svg></span>`,
    '🚆': `<span class="title-icon train" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><rect x="5" y="3" width="14" height="15" rx="3"/><path d="M8 13h3V8H8zM13 8h3v5h-3zM8 18l-2 3M16 18l2 3M9 21h6M7 16h10"/></svg></span>`,
    '🚶': `<span class="title-icon walk" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M8 15c-2-1-3-4-2-6 1-1 2-1 3 1 1 2 1 4 0 5-.3.4-.6.4-1 0ZM16 9c2 1 3 4 2 6-1 1-2 1-3-1-1-2-1-4 0-5 .3-.4.6-.4 1 0Z"/></svg></span>`,
    '☎': `<span class="title-icon action" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M7 4h3l1.3 3.2-2 1.5a13 13 0 0 0 6 6l1.5-2L20 14v3c0 1-1 2-2 2C10.3 19 5 13.7 5 6c0-1 1-2 2-2Z"/></svg></span>`,
    '🏨': `<span class="title-icon stay" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="m3 10 9-7 9 7v10H3V10Z"/><path d="M7 20v-6h10v6M7 16h10M10 14v-2h4v2"/></svg></span>`,
    '📍': `<span class="title-icon sight" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M4 10h16L12 4 4 10ZM6 10v9M10 10v9M14 10v9M18 10v9M4 19h16"/></svg></span>`,
    '🛍': `<span class="title-icon bag" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/></svg></span>`,
    'check': `<span class="title-icon check" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8 12 2.5 2.5L16 9"/></svg></span>`
  };
  return icons[row.icon] || icons.action;
}

function render(){
  const root = document.getElementById('content');
  root.innerHTML = days.map((d, di) => {
    const reminders = d.rows.filter(r =>
      r.kind === 'action' || r.kind === 'train' || isHot(r.reserve, r.place) || /日落/.test(r.note)
    ).slice(0,7);

    return `
      <section class="day ${di===0?'active':''}" id="${d.id}" role="tabpanel" aria-labelledby="tab-${d.id}" tabindex="-1">
        <div class="day-head">
          <div class="date">${esc(d.day)}｜${esc(d.date)}</div>
          <div class="route">${esc(d.route)}</div>
        </div>
        ${reminders.length ? `
          <div class="quick"><b>今天要特別注意：</b>
            <ul class="quick-list">
              ${reminders.map(r => `<li><span class="quick-marker" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="m5 12 4 4L19 6"/></svg></span><span>${esc(r.time)}　${esc(r.place)}${r.reserve && r.reserve!=='—' ? `（${esc(r.reserve)}）` : ''}</span></li>`).join('')}
            </ul>
          </div>` : ''}
        <div class="timeline">
          ${d.rows.map((r, ri) => {
            const key = `${d.id}-${ri}`;
            const checked = localStorage.getItem('tainan-'+key) === '1';
            const hot = isHot(r.reserve, r.place);
            let buttons = '';
            if(r.nav_url) buttons += `<a class="btn primary" href="${esc(r.nav_url)}" target="_blank" rel="noopener">導航</a>`;
            else if(r.map_url) buttons += `<a class="btn primary" href="${esc(r.map_url)}" target="_blank" rel="noopener">Google Maps</a>`;
            if(r.phones && r.phones.length){
              buttons += r.phones.map((p,i)=>`<a class="btn call" href="tel:${esc(p)}">撥打${r.phones.length>1?' '+(i+1):''}</a>`).join('');
            }
            return `
              <article class="card ${esc(r.kind)} ${checked?'done':''}" data-key="${key}">
                <div class="top">
                  <input class="check" type="checkbox" ${checked?'checked':''} aria-label="標記完成">
                  <div class="content">
                    <div class="time">${esc(r.time)}</div>
                    <div class="title">${titleIcon(r)}<span>${esc(r.place)}</span></div>
                    ${r.transport && r.transport !== '—' ? `<div class="meta">${esc(r.transport)}</div>` : ''}
                    ${r.note ? `<div class="note">${esc(r.note)}</div>` : ''}
                    ${r.reserve && r.reserve !== '—' ? `<span class="reserve ${hot?'hot':''}">${esc(r.reserve)}</span>` : ''}
                    ${buttons ? `<div class="actions">${buttons}</div>` : ''}
                  </div>
                  ${characterArt(r)}
                </div>
              </article>
            `;
          }).join('')}
        </div>
      </section>
    `;
  }).join('');

  document.querySelectorAll('.check').forEach(ch => {
    ch.addEventListener('change', e => {
      const card = e.target.closest('.card');
      const key = card.dataset.key;
      localStorage.setItem('tainan-'+key, e.target.checked ? '1' : '0');
      card.classList.toggle('done', e.target.checked);
    });
  });
}

function switchDay(dayId){
  document.querySelectorAll('.day').forEach(x=>{
    const active = x.id === dayId;
    x.classList.toggle('active',active);
    x.hidden = !active;
  });
  document.querySelectorAll('.tab').forEach(x=>{
    const active = x.dataset.day === dayId;
    x.classList.toggle('active',active);
    x.setAttribute('aria-selected',active ? 'true' : 'false');
  });
  localStorage.setItem('tainan-active-day', dayId);
  window.scrollTo({top:0,behavior:'smooth'});
}

render();

document.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click',()=>switchDay(btn.dataset.day));
});

const savedDay = localStorage.getItem('tainan-active-day');
switchDay(savedDay && document.getElementById(savedDay) ? savedDay : 'day1');

document.getElementById('currentBtn').addEventListener('click',()=>{
  const active = document.querySelector('.day.active');
  const next = [...active.querySelectorAll('.card')].find(c=>!c.classList.contains('done'));
  if(next) next.scrollIntoView({behavior:'smooth',block:'center'});
});

document.getElementById('resetBtn').addEventListener('click',()=>{
  const active = document.querySelector('.day.active');
  active.querySelectorAll('.card').forEach(c=>{
    localStorage.removeItem('tainan-'+c.dataset.key);
    c.classList.remove('done');
    const chk=c.querySelector('.check'); if(chk) chk.checked=false;
  });
});
</script>
</body>
</html>
